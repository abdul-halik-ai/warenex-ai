version: '3.8'

services:
  warenex-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://warenex:warenexpassword@db:5432/warenex_db?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=warenex-ai-enterprise-production-secret-2026
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: warenex
      POSTGRES_PASSWORD: warenexpassword
      POSTGRES_DB: warenex_db
    ports:
      - '5432:5432'
    volumes:
      - warenex_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - warenex_redis_data:/data

volumes:
  warenex_db_data:
  warenex_redis_data:
